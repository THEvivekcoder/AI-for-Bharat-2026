<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BharatSahayak | Government of India</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="api-client-email.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-blue: #3b82f6;
            --primary: #06038D;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --white: #ffffff;
            --border-light: #e5e7eb;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --radius: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
            --shadow-xl: 0 8px 32px rgba(0,0,0,0.16);
            --shadow-colored: 0 4px 16px rgba(102, 126, 234, 0.3);
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        [data-theme="dark"] {
            --bg-primary: #1f2937;
            --bg-secondary: #374151;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --border-light: #4b5563;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before,
        .auth-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
        }

        .auth-container::before {
            width: 600px;
            height: 600px;
            background: rgba(255, 153, 51, 0.3);
            top: -200px;
            right: -200px;
        }

        .auth-container::after {
            width: 500px;
            height: 500px;
            background: rgba(19, 136, 8, 0.3);
            bottom: -150px;
            left: -150px;
            animation-delay: 4s;
        }

        .auth-card {
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease-out;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem;
            background: var(--gradient-primary);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--white);
            box-shadow: var(--shadow-colored);
            animation: pulse 3s infinite;
        }

        .auth-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 0.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: var(--radius-md);
        }

        .auth-tab {
            flex: 1;
            padding: 0.875rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-tab.active {
            background: var(--gradient-primary);
            color: var(--white);
            box-shadow: var(--shadow);
        }

        .auth-tab:hover:not(.active) {
            background: rgba(6, 3, 141, 0.1);
            color: var(--primary);
        }

        .auth-tab-content {
            display: none;
        }

        .auth-tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-light);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: var(--transition);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(6, 3, 141, 0.1);
        }

        .form-control:hover {
            border-color: var(--primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .guest-option {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-light);
        }

        .guest-option p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 2rem;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="auth-logo-icon">
                    <i class="fas fa-hands-helping"></i>
                </div>
                <h1 class="auth-title">BharatSahayak</h1>
                <p class="auth-subtitle">Government of India Digital Services Portal</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login', this)">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button class="auth-tab" onclick="switchTab('register', this)">
                    <i class="fas fa-user-plus"></i> Register
                </button>
            </div>

            <!-- Login Tab -->
            <div id="login-tab" class="auth-tab-content active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <input type="email" id="login-email" class="form-control" 
                               placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" id="login-password" class="form-control" 
                               placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>

                <div class="guest-option">
                    <p><span style="color: var(--text-blue); font-weight: 600;">Want to explore first?</span></p>
                    <button onclick="continueAsGuest()" class="btn btn-secondary btn-block">
                        <i class="fas fa-eye"></i> Continue as Guest
                    </button>
                </div>
            </div>

            <!-- Register Tab -->
            <div id="register-tab" class="auth-tab-content">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-user"></i> Full Name
                        </label>
                        <input type="text" id="register-name" class="form-control" 
                               placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-envelope"></i> Email Address
                        </label>
                        <input type="email" id="register-email" class="form-control" 
                               placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-lock"></i> Password
                        </label>
                        <input type="password" id="register-password" class="form-control" 
                               placeholder="At least 8 characters" minlength="8" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">
                            <i class="fas fa-lock"></i> Confirm Password
                        </label>
                        <input type="password" id="register-confirm-password" class="form-control" 
                               placeholder="Re-enter your password" required>
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms" style="margin: 0; font-weight: 400;">
                            I agree to the <a href="#" style="color: var(--text-blue);">Terms & Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">
                        <i class="fas fa-user-plus"></i> Register Now
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 10000;"></div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;">
        <div style="text-align: center; color: white;">
            <div style="width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid white; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;"></div>
            <p>Please wait...</p>
        </div>
    </div>

    <script>
        // Wait for API to be ready
        window.addEventListener('api-ready', function() {
            console.log('🔐 Login: API ready');
        });

        function switchTab(tab, clickedElement) {
            document.querySelectorAll('.auth-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-tab-content').forEach(content => content.classList.remove('active'));
            
            if (clickedElement) {
                clickedElement.classList.add('active');
            }
            
            document.getElementById(`${tab}-tab`).classList.add('active');
        }

        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showToast('Please enter email and password', 'error');
                return;
            }
            
            showLoading();
            
            try {
                console.log('🔑 Logging in with email:', email);
                const result = await api.loginWithEmail(email, password);
                
                if (result.success) {
                    hideLoading();
                    showToast('Login successful!', 'success');
                    
                    setTimeout(() => {
                        if (result.data.profile_completed) {
                            window.location.href = 'dashboard.html';
                        } else {
                            window.location.href = 'profile-setup.html';
                        }
                    }, 1000);
                } else {
                    hideLoading();
                    showToast(result.error || 'Login failed. Please try again.', 'error');
                }
            } catch (error) {
                hideLoading();
                console.error('Login error:', error);
                showToast('Network error. Please check your connection and try again.', 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            
            const name = document.getElementById('register-name').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            const terms = document.getElementById('terms').checked;

            if (!name || !email || !password) {
                showToast('Please fill all required fields', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showToast('Passwords do not match', 'error');
                return;
            }

            if (password.length < 8) {
                showToast('Password must be at least 8 characters', 'error');
                return;
            }

            if (!terms) {
                showToast('Please accept terms and conditions', 'error');
                return;
            }

            showLoading();
            
            try {
                console.log('📝 Registering user:', email);
                const result = await api.registerWithEmail(email, password, name);
                
                if (result.success) {
                    hideLoading();
                    showToast('Registration successful! Please login.', 'success');
                    
                    setTimeout(() => {
                        switchTab('login', document.querySelectorAll('.auth-tab')[0]);
                        document.getElementById('login-email').value = email;
                    }, 1500);
                } else {
                    hideLoading();
                    showToast(result.error || 'Registration failed. Please try again.', 'error');
                }
            } catch (error) {
                hideLoading();
                console.error('Registration error:', error);
                showToast('Network error. Please check your connection and try again.', 'error');
            }
        }

        function continueAsGuest() {
            showLoading();
            setTimeout(() => {
                hideLoading();
                showToast('Continuing as guest...', 'info');
                localStorage.setItem('bharatsahayak-guest', 'true');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }, 500);
        }

        function showLoading() {
            document.getElementById('loading-overlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading-overlay').style.display = 'none';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.style.cssText = 'background: white; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); margin-bottom: 10px; display: flex; align-items: center; gap: 0.75rem; min-width: 300px; animation: slideIn 0.3s ease-out;';
            
            const icons = {
                success: { icon: 'check-circle', color: '#10b981' },
                error: { icon: 'exclamation-circle', color: '#ef4444' },
                warning: { icon: 'exclamation-triangle', color: '#f59e0b' },
                info: { icon: 'info-circle', color: '#3b82f6' }
            };
            
            const config = icons[type] || icons.info;
            toast.innerHTML = `
                <i class="fas fa-${config.icon}" style="color: ${config.color}; font-size: 1.25rem;"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideOut 0.3s ease-in';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Check URL parameters
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.get('mode') === 'register') {
                switchTab('register', document.querySelectorAll('.auth-tab')[1]);
            }
            
            if (urlParams.get('guest') === 'true') {
                continueAsGuest();
            }
        });
    </script>
    
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }
    </style>
</body>
</html>
