<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - BharatSahayak</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-blue: #3b82f6;
            --primary: #06038D;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --white: #ffffff;
            --border-light: #e5e7eb;
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --radius: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
            --shadow-xl: 0 8px 32px rgba(0,0,0,0.16);
            --shadow-colored: 0 4px 16px rgba(102, 126, 234, 0.3);
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .auth-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 0.5rem;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: var(--radius-md);
        }

        .auth-tab {
            flex: 1;
            padding: 0.875rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
            transition: var(--transition);
        }

        .auth-tab.active {
            background: var(--gradient-primary);
            color: var(--white);
            box-shadow: var(--shadow);
        }

        .auth-tab:hover:not(.active) {
            background: rgba(6, 3, 141, 0.1);
            color: var(--primary);
        }

        .auth-tab-content {
            display: none;
        }

        .auth-tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-control {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-light);
            border-radius: var(--radius);
            font-size: 1rem;
            transition: var(--transition);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(6, 3, 141, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 1.5rem;
            border: none;
            border-radius: var(--radius);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: var(--white);
            box-shadow: var(--shadow-colored);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-block {
            width: 100%;
        }

        .status-message {
            padding: 10px;
            margin: 10px 0;
            border-radius: var(--radius);
            font-weight: 500;
        }

        .status-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .debug-panel {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 15px;
            margin: 20px 0;
            border-radius: var(--radius);
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1 class="auth-title">BharatSahayak</h1>
        <p class="auth-subtitle">Tab Switching Test</p>

        <!-- Debug Panel -->
        <div class="debug-panel" id="debug-log">
            Debug log will appear here...
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="switchTab('login', this)">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
            <button class="auth-tab" onclick="switchTab('register', this)">
                <i class="fas fa-user-plus"></i> Register
            </button>
        </div>

        <!-- Login Tab -->
        <div id="login-tab" class="auth-tab-content active">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-phone"></i> Mobile Number
                </label>
                <input type="tel" class="form-control" placeholder="+91 XXXXX XXXXX">
            </div>
            <button class="btn btn-primary btn-block">
                <i class="fas fa-paper-plane"></i> Send OTP
            </button>
            <div class="status-message status-success" style="margin-top: 15px;">
                ✅ Login tab is active and working!
            </div>
        </div>

        <!-- Register Tab -->
        <div id="register-tab" class="auth-tab-content">
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-phone"></i> Mobile Number
                </label>
                <input type="tel" class="form-control" placeholder="+91 XXXXX XXXXX">
            </div>
            <div class="form-group">
                <label class="form-label">
                    <i class="fas fa-language"></i> Language
                </label>
                <select class="form-control">
                    <option>Select Language</option>
                    <option>English</option>
                    <option>हिंदी (Hindi)</option>
                </select>
            </div>
            <button class="btn btn-primary btn-block">
                <i class="fas fa-user-plus"></i> Register Now
            </button>
            <div class="status-message status-success" style="margin-top: 15px;">
                ✅ Register tab is active and working!
            </div>
        </div>
    </div>

    <script>
        function debugLog(message) {
            const debugEl = document.getElementById('debug-log');
            const timestamp = new Date().toLocaleTimeString();
            debugEl.innerHTML += `[${timestamp}] ${message}<br>`;
            debugEl.scrollTop = debugEl.scrollHeight;
            console.log(`[DEBUG] ${message}`);
        }

        function switchTab(tab, clickedElement) {
            debugLog(`🔄 switchTab called: tab='${tab}', element=${clickedElement ? 'provided' : 'null'}`);
            
            try {
                // Remove active class from all tabs and content
                const allTabs = document.querySelectorAll('.auth-tab');
                const allContent = document.querySelectorAll('.auth-tab-content');
                
                debugLog(`📋 Found ${allTabs.length} tabs, ${allContent.length} content panels`);
                
                allTabs.forEach((btn, i) => {
                    btn.classList.remove('active');
                    debugLog(`  ➖ Removed active from tab ${i}`);
                });
                
                allContent.forEach((content, i) => {
                    content.classList.remove('active');
                    debugLog(`  ➖ Removed active from content ${i}`);
                });
                
                // Add active class to clicked tab
                if (clickedElement) {
                    clickedElement.classList.add('active');
                    debugLog(`  ➕ Added active to clicked element`);
                } else {
                    debugLog(`  ⚠️ No clicked element, using fallback`);
                }
                
                // Show corresponding content
                const targetContent = document.getElementById(`${tab}-tab`);
                if (targetContent) {
                    targetContent.classList.add('active');
                    debugLog(`  ✅ Activated content: ${tab}-tab`);
                } else {
                    debugLog(`  ❌ Content not found: ${tab}-tab`);
                }
                
                debugLog(`🎉 Tab switch completed successfully!`);
                
            } catch (error) {
                debugLog(`❌ ERROR: ${error.message}`);
                console.error('Tab switching error:', error);
            }
        }

        // Test functions
        function testLogin() {
            debugLog('🧪 Testing login tab...');
            const loginTab = document.querySelector('.auth-tab[onclick*="login"]');
            switchTab('login', loginTab);
        }

        function testRegister() {
            debugLog('🧪 Testing register tab...');
            const registerTab = document.querySelector('.auth-tab[onclick*="register"]');
            switchTab('register', registerTab);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('🚀 Page loaded and ready');
            debugLog(`📊 Initial state: Login=${document.getElementById('login-tab').classList.contains('active')}, Register=${document.getElementById('register-tab').classList.contains('active')}`);
            
            // Add test buttons
            setTimeout(() => {
                debugLog('🔧 You can test tab switching by clicking the tabs above');
                debugLog('💡 Or run testLogin() and testRegister() in console');
            }, 1000);
        });

        // Make test functions available globally
        window.testLogin = testLogin;
        window.testRegister = testRegister;
    </script>
</body>
</html>
