<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity - BharatSahayak</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="logo">🇮🇳 BharatSahayak</a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="search.html">
          <span class="icon">🔍</span>
          <span>Search Schemes</span>
        </a>
        <a href="saved.html">
          <span class="icon">⭐</span>
          <span>Saved Schemes</span>
        </a>
        <a href="activity.html">
          <span class="icon">📈</span>
          <span>Activity</span>
        </a>
        <a href="settings.html">
          <span class="icon">⚙️</span>
          <span>Settings</span>
        </a>
        <a href="#" onclick="event.preventDefault(); auth.logout();" style="margin-top: 2rem; color: var(--danger);">
          <span class="icon">🚪</span>
          <span>Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle">☰</button>
        <h1 style="font-size: 1.25rem; font-weight: 600;">Activity</h1>
        <div class="user-menu">
          <span id="userName" style="color: var(--gray);"></span>
          <div class="user-avatar" id="userAvatar"></div>
        </div>
      </header>

      <div class="content-area">
        <div class="card mb-4">
          <h2>Your Activity</h2>
          <p class="text-muted">Track your interactions with schemes</p>
        </div>

        <!-- Activity Timeline -->
        <div class="card">
          <h3 class="mb-3">Recent Activity</h3>
          <div id="activityList" style="display: flex; flex-direction: column; gap: 1rem;">
            <!-- Activity items will be loaded here -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="js/schemes-data.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Check auth
    if (!auth.isLoggedIn()) {
      window.location.href = 'login.html';
    }
    
    // Load user info
    const user = auth.getUser();
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    
    // Load activity
    function loadActivity() {
      const activityList = document.getElementById('activityList');
      const saved = savedSchemes.getAll();
      
      if (saved.length === 0) {
        activityList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📈</div>
            <h3>No activity yet</h3>
            <p>Start exploring schemes to see your activity here</p>
            <a href="search.html" class="btn btn-primary mt-3">Search Schemes</a>
          </div>
        `;
        return;
      }
      
      // Show saved schemes as activity
      activityList.innerHTML = saved.map(scheme => `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--light-gray); border-radius: var(--radius); cursor: pointer;" onclick="viewScheme('${scheme.id}')">
          <div>
            <div style="font-weight: 600; margin-bottom: 0.25rem;">Saved: ${scheme.name}</div>
            <div style="font-size: 0.875rem; color: var(--gray);">${scheme.category || 'General'}</div>
          </div>
          <span class="text-muted" style="font-size: 0.875rem;">Recently</span>
        </div>
      `).join('');
    }
    
    loadActivity();
  </script>
</body>
</html>
