<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheme Details - BharatSahayak</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="logo">🇮🇳 BharatSahayak</a>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a href="search.html">
          <span class="icon">🔍</span>
          <span>Search Schemes</span>
        </a>
        <a href="saved.html">
          <span class="icon">⭐</span>
          <span>Saved Schemes</span>
        </a>
        <a href="#">
          <span class="icon">📈</span>
          <span>Activity</span>
        </a>
        <a href="#">
          <span class="icon">⚙️</span>
          <span>Settings</span>
        </a>
        <a href="#" onclick="auth.logout(); return false;" style="margin-top: 2rem; color: var(--danger);">
          <span class="icon">🚪</span>
          <span>Logout</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <button class="menu-toggle">☰</button>
        <div class="flex" style="align-items: center; gap: 1rem;">
          <a href="search.html" class="btn btn-ghost">← Back</a>
          <h1 style="font-size: 1.25rem; font-weight: 600;">Scheme Details</h1>
        </div>
        <div class="user-menu">
          <span id="userName" style="color: var(--gray);"></span>
          <div class="user-avatar" id="userAvatar"></div>
        </div>
      </header>

      <div class="content-area">
        <div id="schemeDetails"></div>
      </div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Check auth
    if (!auth.isLoggedIn()) {
      window.location.href = 'login.html';
    }
    
    // Load user info
    const user = auth.getUser();
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    
    // Get scheme ID from URL
    const urlParams = new URLSearchParams(window.location.search);
    const schemeId = urlParams.get('id');
    
    if (!schemeId) {
      window.location.href = 'search.html';
    }
    
    const scheme = getSchemeById(schemeId);
    
    if (!scheme) {
      document.getElementById('schemeDetails').innerHTML = `
        <div class="card">
          <h2>Scheme not found</h2>
          <p class="text-muted">The scheme you're looking for doesn't exist.</p>
          <a href="search.html" class="btn btn-primary mt-3">Back to Search</a>
        </div>
      `;
    } else {
      const isSaved = savedSchemes.isSaved(schemeId);
      
      document.getElementById('schemeDetails').innerHTML = `
        <div class="card">
          <div class="flex-between mb-3">
            <span class="scheme-badge badge-${scheme.category}">${formatCategory(scheme.category)}</span>
            <button onclick="toggleSave('${scheme.id}')" id="saveBtn" class="btn ${isSaved ? 'btn-primary' : 'btn-secondary'}">
              ${isSaved ? '⭐ Saved' : '☆ Save Scheme'}
            </button>
          </div>
          
          <h1 class="mb-3">${scheme.title}</h1>
          
          <div class="mb-4">
            <h3 class="mb-2">📝 Description</h3>
            <p class="text-muted">${scheme.description}</p>
          </div>
          
          <div class="mb-4">
            <h3 class="mb-2">✅ Eligibility Criteria</h3>
            <p class="text-muted">${scheme.eligibility}</p>
          </div>
          
          <div class="mb-4">
            <h3 class="mb-2">🎁 Benefits</h3>
            <p class="text-muted">${scheme.benefits}</p>
          </div>
          
          <div class="mb-4">
            <h3 class="mb-2">📄 Required Documents</h3>
            <ul style="list-style: none; padding-left: 0;">
              ${scheme.documents.map(doc => `<li style="padding: 0.5rem 0; color: var(--gray);">• ${doc}</li>`).join('')}
            </ul>
          </div>
          
          <div class="mb-4">
            <h3 class="mb-2">📋 Steps to Apply</h3>
            <ol style="padding-left: 1.5rem; color: var(--gray);">
              ${scheme.steps.map(step => `<li style="padding: 0.5rem 0;">${step}</li>`).join('')}
            </ol>
          </div>
          
          <div class="flex gap-2">
            <a href="${scheme.link}" target="_blank" class="btn btn-primary">Apply Now →</a>
            <button onclick="shareScheme('${scheme.id}')" class="btn btn-secondary">Share</button>
          </div>
        </div>
      `;
    }
    
    function toggleSave(schemeId) {
      const saved = toggleSaveScheme(schemeId);
      const btn = document.getElementById('saveBtn');
      
      if (saved) {
        btn.textContent = '⭐ Saved';
        btn.className = 'btn btn-primary';
        showAlert('Scheme saved successfully!', 'success');
      } else {
        btn.textContent = '☆ Save Scheme';
        btn.className = 'btn btn-secondary';
        showAlert('Scheme removed from saved', 'info');
      }
    }
    
    function shareScheme(schemeId) {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: 'Check out this scheme',
          url: url
        });
      } else {
        navigator.clipboard.writeText(url);
        showAlert('Link copied to clipboard!', 'success');
      }
    }
  </script>
</body>
</html>
