<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - BharatSahayak</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="logo" style="display: block; text-align: center; margin-bottom: 2rem;">🇮🇳 BharatSahayak</a>
      
      <h2>Welcome Back</h2>
      
      <div id="demoModeAlert" class="alert alert-info" style="display: none; margin-bottom: 1rem;">
        🔧 Demo Mode Active - No real API calls
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email or Phone</label>
          <input type="text" id="email" class="form-control" placeholder="Enter your email or phone" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">Login</button>
        
        <button type="button" onclick="auth.loginAsGuest()" class="btn btn-secondary" style="width: 100%;">Continue as Guest</button>
      </form>
      
      <div class="divider"></div>
      
      <p class="text-center text-muted">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Sign Up</a>
      </p>
    </div>
  </div>

  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Show demo mode alert if active
    if (api.demoMode) {
      document.getElementById('demoModeAlert').style.display = 'block';
    }
    
    async function handleLogin(e) {
      e.preventDefault();
      const phoneOrEmail = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';
      
      try {
        const response = await api.login(phoneOrEmail, password);
        
        // Store auth token
        if (response.token) {
          api.setAuthToken(response.token);
        }
        
        // Create user session
        const user = {
          id: response.user_id || 'user_' + Date.now(),
          name: response.name || phoneOrEmail.split('@')[0],
          email: response.email || phoneOrEmail,
          phone: response.phone_number || phoneOrEmail,
          isGuest: false
        };
        
        auth.setUser(user);
        
        // Always go to dashboard (skip profile setup)
        storage.set('profileComplete', true);
        window.location.href = 'dashboard.html';
        
      } catch (error) {
        console.error('Login error:', error);
        showAlert(error.message || 'Login failed. Please check your credentials.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
    }
    
    function showAlert(message, type) {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type} fade-in`;
      alertDiv.textContent = message;
      alertDiv.style.position = 'fixed';
      alertDiv.style.top = '20px';
      alertDiv.style.left = '50%';
      alertDiv.style.transform = 'translateX(-50%)';
      alertDiv.style.zIndex = '1000';
      alertDiv.style.minWidth = '300px';
      
      document.body.appendChild(alertDiv);
      
      setTimeout(() => {
        alertDiv.remove();
      }, 3000);
    }
  </script>
</body>
</html>
