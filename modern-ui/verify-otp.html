<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify OTP - BharatSahayak</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <a href="index.html" class="logo" style="display: block; text-align: center; margin-bottom: 2rem;">🇮🇳 BharatSahayak</a>
      
      <h2>Verify OTP</h2>
      <p class="text-center text-muted mb-4">Enter the OTP sent to your phone</p>
      
      <form id="otpForm" onsubmit="handleVerifyOTP(event)">
        <div class="form-group">
          <label for="otp">OTP Code</label>
          <input type="text" id="otp" class="form-control" placeholder="Enter 6-digit OTP" maxlength="6" pattern="[0-9]{6}" required style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem;">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 1rem;">Verify OTP</button>
        
        <button type="button" onclick="resendOTP()" class="btn btn-ghost" style="width: 100%;">Resend OTP</button>
      </form>
      
      <div class="divider"></div>
      
      <p class="text-center text-muted">
        <a href="login.html" style="color: var(--primary); font-weight: 600;">Back to Login</a>
      </p>
    </div>
  </div>

  <script src="js/api-client.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Check if pending user exists
    const pendingUser = storage.get('pendingUser');
    if (!pendingUser) {
      window.location.href = 'register.html';
    }
    
    async function handleVerifyOTP(e) {
      e.preventDefault();
      
      const otp = document.getElementById('otp').value;
      const submitBtn = e.target.querySelector('button[type="submit"]');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';
      
      try {
        const response = await api.verifyOTP(pendingUser.phone, otp);
        
        // Store auth token
        if (response.token) {
          api.setAuthToken(response.token);
        }
        
        // Create user session
        const user = {
          id: response.user_id || 'user_' + Date.now(),
          name: pendingUser.name,
          email: pendingUser.email,
          phone: pendingUser.phone,
          isGuest: false
        };
        
        auth.setUser(user);
        storage.remove('pendingUser');
        
        showAlert('Phone verified successfully!', 'success');
        
        // Redirect to profile setup
        setTimeout(() => {
          window.location.href = 'profile-setup.html';
        }, 1000);
        
      } catch (error) {
        console.error('OTP verification error:', error);
        showAlert(error.message || 'Invalid OTP. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verify OTP';
      }
    }
    
    async function resendOTP() {
      showAlert('OTP resent to your phone!', 'info');
      // In production, call API to resend OTP
    }
    
    function showAlert(message, type) {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type} fade-in`;
      alertDiv.textContent = message;
      alertDiv.style.position = 'fixed';
      alertDiv.style.top = '20px';
      alertDiv.style.left = '50%';
      alertDiv.style.transform = 'translateX(-50%)';
      alertDiv.style.zIndex = '1000';
      alertDiv.style.minWidth = '300px';
      
      document.body.appendChild(alertDiv);
      
      setTimeout(() => {
        alertDiv.remove();
      }, 3000);
    }
  </script>
</body>
</html>
