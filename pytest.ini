[pytest]
# Pytest configuration for BharatSahayak

# Python path
pythonpath = .

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    performance: Performance tests
    slow: Slow-running tests
    stress: Stress tests
    voice: Voice processing tests
    resource: Resource usage tests
    integration: Integration tests
    unit: Unit tests
    property: Property-based tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers

# Test paths
testpaths = .kiro/specs/bharatsahayak/tests

# Ignore paths
norecursedirs = .git .hypothesis __pycache__ venv env .env
