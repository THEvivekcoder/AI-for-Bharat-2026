# Template Fixes for BharatSahayak
# These additions and modifications fix the path mismatches between frontend and backend

# ADD THESE NEW FUNCTIONS TO template.yaml:

  # Auth: User Login (MISSING - ADD THIS)
  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-login-${Environment}
      CodeUri: .
      Handler: src.api.auth_login.lambda_handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          USERS_TABLE: !Ref UsersTable
          AWS_REGION: !Ref AWS::Region
          LOG_LEVEL: !If [IsProd, INFO, DEBUG]
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:AdminInitiateAuth
              Resource: !GetAtt UserPool.Arn
      Events:
        LoginApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE

  # Conversational Query (MISSING - ADD THIS)
  ConversationalQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-conversational-query-${Environment}
      CodeUri: .
      Handler: src.api.conversational_query.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
          AWS_REGION: !Ref AWS::Region
          LOG_LEVEL: !If [IsProd, INFO, DEBUG]
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        ConversationalQueryApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /conversational-query
            Method: POST
            Auth:
              Authorizer: NONE

  # User Stats (MISSING - ADD THIS)
  UserStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-user-stats-${Environment}
      CodeUri: .
      Handler: src.api.user_stats.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserProfilesTable
          INTERACTIONS_TABLE: !Ref InteractionsTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
        - DynamoDBReadPolicy:
            TableName: !Ref InteractionsTable
      Events:
        UserStatsApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /user/stats
            Method: GET

  # Schemes Search (ADD EXPLICIT ROUTE)
  SearchSchemesExplicitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-search-schemes-explicit-${Environment}
      CodeUri: .
      Handler: src.api.schemes_search.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        SearchSchemesExplicitApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/search
            Method: GET
            Auth:
              Authorizer: NONE

