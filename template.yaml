AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BharatSahayak - Voice-first multilingual AI assistant for rural India

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !If [IsProd, INFO, DEBUG]
        ENABLE_XRAY: !If [IsProd, 'true', 'false']
    Tracing: !If [IsProd, Active, PassThrough]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment
  
  JWTSecret:
    Type: String
    NoEcho: true
    Description: JWT secret for authentication (will be generated if not provided)
    Default: 'CHANGE_ME_GENERATE_SECURE_SECRET_HERE'

Resources:
  # API Gateway
  BharatSahayakApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Variables:
        Environment: !Ref Environment
        LogLevel: !If [IsProd, INFO, DEBUG]
        EnableCaching: !If [IsProd, 'true', 'false']
        CacheTTL: !If [IsProd, '300', '60']
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Requested-With'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          MetricsEnabled: true
        - ResourcePath: '/schemes'
          HttpMethod: GET
          CachingEnabled: !If [IsProd, true, false]
          CacheTtlInSeconds: !If [IsProd, 300, 0]
          CacheDataEncrypted: true
        - ResourcePath: '/schemes/{scheme_id}'
          HttpMethod: GET
          CachingEnabled: !If [IsProd, true, false]
          CacheTtlInSeconds: !If [IsProd, 300, 0]
          CacheDataEncrypted: true
      Models:
        UserProfileModel:
          type: object
          required:
            - phone_number
            - language
          properties:
            phone_number:
              type: string
              pattern: '^\+?[1-9]\d{1,14}$'
            language:
              type: string
              enum: [hi, en, bn, te, mr, ta, gu, kn, ml, pa]
            location:
              type: object
              properties:
                state:
                  type: string
                district:
                  type: string
                pincode:
                  type: string
            age:
              type: integer
              minimum: 0
              maximum: 150
            gender:
              type: string
              enum: [male, female, other]
            education_level:
              type: string
            occupation:
              type: string
            income_bracket:
              type: string
        EligibilityCheckRequest:
          type: object
          required:
            - scheme_id
            - user_profile
          properties:
            scheme_id:
              type: string
            user_profile:
              $ref: '#/definitions/UserProfileModel'
        ErrorResponse:
          type: object
          properties:
            error:
              type: string
            message:
              type: string
            details:
              type: object

  # Cognito resources removed - using email/password authentication with JWT tokens

  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: phone-number-index
          KeySchema:
            - AttributeName: phone_number
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SchemesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-schemes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scheme_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: scheme_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-user-profiles-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  SavedSchemesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-saved-schemes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: scheme_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: scheme_id
          KeyType: RANGE

  InteractionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-interactions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  FarmProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-farm-profiles-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  MandiPricesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-mandi-prices-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: crop_name
          AttributeType: S
        - AttributeName: state_district
          AttributeType: S
      KeySchema:
        - AttributeName: crop_name
          KeyType: HASH
        - AttributeName: state_district
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SkillProgramsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-skill-programs-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: program_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: program_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  JobPostingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-job-postings-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: department
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: department-index
          KeySchema:
            - AttributeName: department
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  HealthFacilitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-health-facilities-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: facility_id
          AttributeType: S
      KeySchema:
        - AttributeName: facility_id
          KeyType: HASH

  TranslationCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-translation-cache-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # S3 Buckets
  VoiceDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-voice-${AWS::AccountId}-${Environment}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVoiceData
            Status: Enabled
            ExpirationInDays: 30

  ModelsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-models-${AWS::AccountId}-${Environment}
      VersioningConfiguration:
        Status: Enabled

  # Static Content and Scheme Documents Bucket
  StaticContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-static-${AWS::AccountId}-${Environment}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldCacheToIA
            Status: Enabled
            Prefix: cache/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
          - Id: DeleteOldCache
            Status: Enabled
            Prefix: cache/
            ExpirationInDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Purpose
          Value: StaticContentAndSchemeDocuments
        - Key: Environment
          Value: !Ref Environment

  # Bucket Policy for Public Read Access to Scheme Documents
  StaticContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource:
              - !Sub ${StaticContentBucket.Arn}/schemes/*
              - !Sub ${StaticContentBucket.Arn}/documents/*
              - !Sub ${StaticContentBucket.Arn}/app/*
          - Sid: AllowListBucket
            Effect: Allow
            Principal: '*'
            Action:
              - s3:ListBucket
            Resource: !GetAtt StaticContentBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - schemes/*
                  - documents/*
                  - app/*

  # Lambda Functions
  
  # Old phone/OTP registration removed - using email/password registration (AuthEmailRegisterFunction)
  # Old OTP verification removed - using email/password login (AuthEmailLoginFunction)
  # Old phone/OTP login removed - using email/password login (AuthEmailLoginFunction)
  # Auth: Email Registration (NEW)
  AuthEmailRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-auth-email-register-${Environment}
      CodeUri: .
      Handler: src.api.auth_email_register.lambda_handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        RegisterEmailAPI:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /auth/email/register
            Method: POST
  # Auth: Email Login (NEW)
  AuthEmailLoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-auth-email-login-${Environment}
      CodeUri: .
      Handler: src.api.auth_email_login.lambda_handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
      Events:
        LoginEmailAPI:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /auth/email/login
            Method: POST
  # Dashboard: Get Dashboard Data (NEW)
  DashboardDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-dashboard-data-${Environment}
      CodeUri: .
      Handler: src.api.dashboard_data.lambda_handler
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          PROFILES_TABLE: !Ref UserProfilesTable
          SAVED_SCHEMES_TABLE: !Ref SavedSchemesTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedSchemesTable
      Events:
        DashboardAPI:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /dashboard/data
            Method: GET
  # Schemes: Save/Unsave Scheme (NEW)
  SaveSchemeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-save-scheme-${Environment}
      CodeUri: .
      Handler: src.api.save_scheme.lambda_handler
      Environment:
        Variables:
          SAVED_SCHEMES_TABLE: !Ref SavedSchemesTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SavedSchemesTable
      Events:
        SaveSchemeAPI:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/save
            Method: POST
  # User Profile: Get
  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-get-profile-${Environment}
      CodeUri: .
      Handler: src.api.user_profile_get.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserProfilesTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
      Events:
        GetProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /user/profile
            Method: GET

  # User Profile: Update
  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-update-profile-${Environment}
      CodeUri: .
      Handler: src.api.user_profile_update.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserProfilesTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
      Events:
        UpdateProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /user/profile
            Method: PUT

  # User Stats (ADDED)
  UserStatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-user-stats-${Environment}
      CodeUri: .
      Handler: src.api.user_stats.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserProfilesTable
          INTERACTIONS_TABLE: !Ref InteractionsTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
        - DynamoDBReadPolicy:
            TableName: !Ref InteractionsTable
      Events:
        UserStatsApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /user/stats
            Method: GET

  # Schemes: Search
  SearchSchemesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-search-schemes-${Environment}
      CodeUri: .
      Handler: src.api.schemes_search.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        SearchSchemesApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes
            Method: GET
  # Schemes: Search Explicit Route (ADDED)
  SearchSchemesExplicitFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-search-schemes-explicit-${Environment}
      CodeUri: .
      Handler: src.api.schemes_search.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        SearchSchemesExplicitApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/search
            Method: GET
  # Schemes: Get Details
  GetSchemeDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-scheme-details-${Environment}
      CodeUri: .
      Handler: src.api.scheme_details.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        GetSchemeDetailsApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/{scheme_id}
            Method: GET
  # Eligibility: Check Single Scheme
  CheckEligibilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-check-eligibility-${Environment}
      CodeUri: .
      Handler: src.api.check_eligibility.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        CheckEligibilityApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/check-eligibility
            Method: POST

  # Eligibility: Get All Eligible Schemes
  GetEligibleSchemesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-eligible-schemes-${Environment}
      CodeUri: .
      Handler: src.api.eligible_schemes.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        GetEligibleSchemesApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/eligible
            Method: GET

  # Farmer Advisory: Crop Recommendations
  CropAdviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-crop-advice-${Environment}
      CodeUri: .
      Handler: src.api.crop_advice.lambda_handler
      Environment:
        Variables:
          FARM_PROFILES_TABLE: !Ref FarmProfilesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FarmProfilesTable
      Events:
        CropAdviceApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /crop-advice
            Method: GET
  # Farmer Advisory: Mandi Prices
  MarketPriceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-market-price-${Environment}
      CodeUri: .
      Handler: src.api.market_price.lambda_handler
      Environment:
        Variables:
          MANDI_PRICES_TABLE: !Ref MandiPricesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MandiPricesTable
      Events:
        MarketPriceApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /market-prices
            Method: GET
  # Skills: Program Matching
  SkillsMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-skills-match-${Environment}
      CodeUri: .
      Handler: src.api.skills_match.lambda_handler
      Environment:
        Variables:
          SKILL_PROGRAMS_TABLE: !Ref SkillProgramsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SkillProgramsTable
      Events:
        SkillsMatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /skills/match
            Method: POST

  # Skills: Job Search
  JobSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-job-search-${Environment}
      CodeUri: .
      Handler: src.api.job_search.lambda_handler
      Environment:
        Variables:
          JOB_POSTINGS_TABLE: !Ref JobPostingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobPostingsTable
      Events:
        JobSearchApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /jobs
            Method: GET
  # Health: Facility Search
  HealthFacilitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-health-facilities-${Environment}
      CodeUri: .
      Handler: src.api.health_facilities.lambda_handler
      Environment:
        Variables:
          HEALTH_FACILITIES_TABLE: !Ref HealthFacilitiesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HealthFacilitiesTable
      Events:
        HealthFacilitiesApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /health/facilities
            Method: GET
  # Health: Symptom Checker
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-health-check-${Environment}
      CodeUri: .
      Handler: src.api.health_check.lambda_handler
      Events:
        HealthCheckApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /health-check
            Method: GET
  # Voice Interface: Speech-to-Text
  VoiceToTextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-voice-to-text-${Environment}
      CodeUri: .
      Handler: src.api.voice_to_text.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref VoiceDataBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VoiceDataBucket
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: '*'
      Events:
        VoiceToTextApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /voice-to-text
            Method: POST
  # Voice Interface: Text-to-Speech
  TextToVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-text-to-voice-${Environment}
      CodeUri: .
      Handler: src.api.text_to_voice.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref VoiceDataBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VoiceDataBucket
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'
      Events:
        TextToVoiceApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /voice/synthesize
            Method: POST
  # Voice Interface: Language Detection
  DetectLanguageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-detect-language-${Environment}
      CodeUri: .
      Handler: src.api.detect_language.lambda_handler
      Timeout: 30
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - comprehend:DetectDominantLanguage
                - comprehend:BatchDetectDominantLanguage
              Resource: '*'
      Events:
        DetectLanguageApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /voice/detect-language
            Method: POST
  # Conversational Query (ADDED)
  ConversationalQueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-conversational-query-${Environment}
      CodeUri: .
      Handler: src.api.conversational_query.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        ConversationalQueryApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /conversational-query
            Method: POST
  # Multilingual: Translate Scheme Content
  TranslateSchemeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-translate-scheme-${Environment}
      CodeUri: .
      Handler: src.api.translate_scheme.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          TRANSLATION_CACHE_TABLE: !Ref TranslationCacheTable
          SCHEMES_TABLE: !Ref SchemesTable
          UPDATE_DYNAMODB: 'true'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TranslationCacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemesTable
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
              Resource: '*'
      Events:
        TranslateSchemeApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /translate/scheme
            Method: POST
  # Offline Cache: Export Cache Data
  CacheExportFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-cache-export-${Environment}
      CodeUri: .
      Handler: src.api.cache_export.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
          INTERACTIONS_TABLE: !Ref InteractionsTable
          STATIC_CONTENT_BUCKET: !Ref StaticContentBucket
          CACHE_VERSION: '1.0.0'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
        - DynamoDBReadPolicy:
            TableName: !Ref InteractionsTable
        - S3CrudPolicy:
            BucketName: !Ref StaticContentBucket
      Events:
        CacheExportApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /cache/export
            Method: POST
  # Offline Cache: Sync Cache Data
  CacheSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-cache-sync-${Environment}
      CodeUri: .
      Handler: src.api.cache_sync.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
          STATIC_CONTENT_BUCKET: !Ref StaticContentBucket
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
        - S3ReadPolicy:
            BucketName: !Ref StaticContentBucket
      Events:
        CacheSyncApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /cache/sync
            Method: POST
  # Impact Tracking: Record Event
  ImpactEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-impact-event-${Environment}
      CodeUri: .
      Handler: src.api.impact_event.lambda_handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          INTERACTIONS_TABLE: !Ref InteractionsTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref InteractionsTable
      Events:
        ImpactEventApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /impact/event
            Method: POST

  # Impact Tracking: Get Analytics
  ImpactAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-impact-analytics-${Environment}
      CodeUri: .
      Handler: src.api.impact_analytics.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          INTERACTIONS_TABLE: !Ref InteractionsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InteractionsTable
      Events:
        ImpactAnalyticsApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /impact
            Method: GET

