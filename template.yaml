AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BharatSahayak - Voice-first multilingual AI assistant for rural India

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        ENVIRONMENT: dev
        LOG_LEVEL: INFO

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  # API Gateway
  BharatSahayakApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub bharatsahayak-users-${Environment}
      UsernameAttributes:
        - phone_number
      AutoVerifiedAttributes:
        - phone_number
      MfaConfiguration: OPTIONAL
      SmsConfiguration:
        SnsCallerArn: !GetAtt SNSRole.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub bharatsahayak-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # IAM Role for SNS
  SNSRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSNSFullAccess

  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: phone-number-index
          KeySchema:
            - AttributeName: phone_number
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SchemesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-schemes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scheme_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: scheme_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-user-profiles-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  InteractionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-interactions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # S3 Buckets
  VoiceDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-voice-data-${Environment}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVoiceData
            Status: Enabled
            ExpirationInDays: 30

  ModelsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-models-${Environment}
      VersioningConfiguration:
        Status: Enabled

  # Static Content and Scheme Documents Bucket
  StaticContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-static-content-${Environment}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldCacheToIA
            Status: Enabled
            Prefix: cache/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
          - Id: DeleteOldCache
            Status: Enabled
            Prefix: cache/
            ExpirationInDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Purpose
          Value: StaticContentAndSchemeDocuments
        - Key: Environment
          Value: !Ref Environment

  # Bucket Policy for Public Read Access to Scheme Documents
  StaticContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource:
              - !Sub ${StaticContentBucket.Arn}/schemes/*
              - !Sub ${StaticContentBucket.Arn}/documents/*
          - Sid: AllowListBucket
            Effect: Allow
            Principal: '*'
            Action:
              - s3:ListBucket
            Resource: !GetAtt StaticContentBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - schemes/*
                  - documents/*

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${BharatSahayakApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
  
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  
  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTable
  
  SchemesTableName:
    Description: DynamoDB Schemes Table Name
    Value: !Ref SchemesTable
  
  UserProfilesTableName:
    Description: DynamoDB User Profiles Table Name
    Value: !Ref UserProfilesTable
  
  InteractionsTableName:
    Description: DynamoDB Interactions Table Name
    Value: !Ref InteractionsTable

  StaticContentBucketName:
    Description: S3 Bucket for Static Content and Scheme Documents
    Value: !Ref StaticContentBucket
    Export:
      Name: !Sub ${AWS::StackName}-StaticContentBucket

  StaticContentBucketUrl:
    Description: URL for Static Content Bucket
    Value: !Sub https://${StaticContentBucket}.s3.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub ${AWS::StackName}-StaticContentBucketUrl
