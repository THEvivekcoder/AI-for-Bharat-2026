  # RAG: Create/Clear Session
  SessionManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-session-management-${Environment}
      CodeUri: .
      Handler: src.api.session_management.lambda_handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          CONVERSATION_SESSIONS_TABLE: !Ref ConversationSessionsTable
          JWT_SECRET: !Ref JWTSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConversationSessionsTable
      Events:
        CreateSessionApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /session/create
            Method: POST
        ClearSessionApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /session/{session_id}
            Method: DELETE

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${BharatSahayakApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint
  
  ApiStage:
    Description: API Gateway deployment stage
    Value: !Ref Environment
    Export:
      Name: !Sub ${AWS::StackName}-ApiStage
  
  # Cognito outputs removed - using email/password authentication
  
  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTable
  
  SchemesTableName:
    Description: DynamoDB Schemes Table Name
    Value: !Ref SchemesTable
  
  UserProfilesTableName:
    Description: DynamoDB User Profiles Table Name
    Value: !Ref UserProfilesTable
  
  InteractionsTableName:
    Description: DynamoDB Interactions Table Name
    Value: !Ref InteractionsTable

  FarmProfilesTableName:
    Description: DynamoDB Farm Profiles Table Name
    Value: !Ref FarmProfilesTable

  MandiPricesTableName:
    Description: DynamoDB Mandi Prices Table Name
    Value: !Ref MandiPricesTable

  StaticContentBucketName:
    Description: S3 Bucket for Static Content and Scheme Documents
    Value: !Ref StaticContentBucket
    Export:
      Name: !Sub ${AWS::StackName}-StaticContentBucket

  StaticContentBucketUrl:
    Description: URL for Static Content Bucket
    Value: !Sub https://${StaticContentBucket}.s3.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub ${AWS::StackName}-StaticContentBucketUrl

  VoiceDataBucketName:
    Description: S3 Bucket for Voice Data (Audio Files)
    Value: !Ref VoiceDataBucket
    Export:
      Name: !Sub ${AWS::StackName}-VoiceDataBucket

  TranslationCacheTableName:
    Description: DynamoDB Translation Cache Table Name
    Value: !Ref TranslationCacheTable
    Export:
      Name: !Sub ${AWS::StackName}-TranslationCacheTable

  # DISABLED FOR MVP: Uncomment when enabling OpenSearch
  # OpenSearchDomainEndpoint:
