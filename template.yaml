AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BharatSahayak - Voice-first multilingual AI assistant for rural India

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !If [IsProd, INFO, DEBUG]
        ENABLE_XRAY: !If [IsProd, 'true', 'false']
    Tracing: !If [IsProd, Active, PassThrough]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]
  IsDev: !Equals [!Ref Environment, dev]

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  # API Gateway
  BharatSahayakApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Variables:
        Environment: !Ref Environment
        LogLevel: !If [IsProd, INFO, DEBUG]
        EnableCaching: !If [IsProd, 'true', 'false']
        CacheTTL: !If [IsProd, '300', '60']
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Requested-With'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
        - ResourcePath: '/schemes'
          HttpMethod: GET
          CachingEnabled: !If [IsProd, true, false]
          CacheTtlInSeconds: !If [IsProd, 300, 0]
          CacheDataEncrypted: true
        - ResourcePath: '/schemes/{scheme_id}'
          HttpMethod: GET
          CachingEnabled: !If [IsProd, true, false]
          CacheTtlInSeconds: !If [IsProd, 300, 0]
          CacheDataEncrypted: true
      Models:
        UserProfileModel:
          type: object
          required:
            - phone_number
            - language
          properties:
            phone_number:
              type: string
              pattern: '^\+?[1-9]\d{1,14}$'
            language:
              type: string
              enum: [hi, en, bn, te, mr, ta, gu, kn, ml, pa]
            location:
              type: object
              properties:
                state:
                  type: string
                district:
                  type: string
                pincode:
                  type: string
            age:
              type: integer
              minimum: 0
              maximum: 150
            gender:
              type: string
              enum: [male, female, other]
            education_level:
              type: string
            occupation:
              type: string
            income_bracket:
              type: string
        EligibilityCheckRequest:
          type: object
          required:
            - scheme_id
            - user_profile
          properties:
            scheme_id:
              type: string
            user_profile:
              $ref: '#/definitions/UserProfileModel'
        ErrorResponse:
          type: object
          properties:
            error:
              type: string
            message:
              type: string
            details:
              type: object
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
            gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
            gatewayresponse.header.Access-Control-Allow-Headers: "'*'"
        THROTTLED:
          StatusCode: 429
          ResponseParameters:
            gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
            gatewayresponse.header.Retry-After: "'60'"
          ResponseTemplates:
            application/json: '{"error":"RATE_LIMIT_EXCEEDED","message":"Too many requests. Please try again in 60 seconds.","retry_after_seconds":60}'

  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub bharatsahayak-users-${Environment}
      UsernameAttributes:
        - phone_number
      AutoVerifiedAttributes:
        - phone_number
      MfaConfiguration: OPTIONAL
      SmsConfiguration:
        SnsCallerArn: !GetAtt SNSRole.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub bharatsahayak-client-${Environment}
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # IAM Role for SNS
  SNSRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSNSFullAccess

  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: phone-number-index
          KeySchema:
            - AttributeName: phone_number
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SchemesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-schemes-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: scheme_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: scheme_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  UserProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-user-profiles-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  InteractionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-interactions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  FarmProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-farm-profiles-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  MandiPricesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-mandi-prices-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: crop_name
          AttributeType: S
        - AttributeName: state_district
          AttributeType: S
      KeySchema:
        - AttributeName: crop_name
          KeyType: HASH
        - AttributeName: state_district
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  SkillProgramsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-skill-programs-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: program_id
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: program_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  JobPostingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-job-postings-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: department
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: department-index
          KeySchema:
            - AttributeName: department
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  HealthFacilitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-health-facilities-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: facility_id
          AttributeType: S
      KeySchema:
        - AttributeName: facility_id
          KeyType: HASH

  TranslationCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bharatsahayak-translation-cache-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cache_key
          AttributeType: S
      KeySchema:
        - AttributeName: cache_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # S3 Buckets
  VoiceDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-voice-data-${Environment}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVoiceData
            Status: Enabled
            ExpirationInDays: 30

  ModelsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-models-${Environment}
      VersioningConfiguration:
        Status: Enabled

  # Static Content and Scheme Documents Bucket
  StaticContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bharatsahayak-static-content-${Environment}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionOldCacheToIA
            Status: Enabled
            Prefix: cache/
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
          - Id: DeleteOldCache
            Status: Enabled
            Prefix: cache/
            ExpirationInDays: 90
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      Tags:
        - Key: Purpose
          Value: StaticContentAndSchemeDocuments
        - Key: Environment
          Value: !Ref Environment

  # Bucket Policy for Public Read Access to Scheme Documents
  StaticContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource:
              - !Sub ${StaticContentBucket.Arn}/schemes/*
              - !Sub ${StaticContentBucket.Arn}/documents/*
          - Sid: AllowListBucket
            Effect: Allow
            Principal: '*'
            Action:
              - s3:ListBucket
            Resource: !GetAtt StaticContentBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - schemes/*
                  - documents/*

  # Lambda Functions
  
  # Auth: User Registration
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-register-${Environment}
      CodeUri: .
      Handler: src.api.auth_register.lambda_handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          USERS_TABLE: !Ref UsersTable
          PROFILES_TABLE: !Ref UserProfilesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
              Resource: !GetAtt UserPool.Arn
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /auth/register
            Method: POST
            Auth:
              Authorizer: NONE

  # Auth: OTP Verification
  VerifyOTPFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-verify-otp-${Environment}
      CodeUri: .
      Handler: src.api.auth_verify.lambda_handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          JWT_SECRET: !Sub '{{resolve:secretsmanager:bharatsahayak-jwt-secret-${Environment}:SecretString:jwt_secret}}'
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ConfirmSignUp
                - cognito-idp:InitiateAuth
                - cognito-idp:RespondToAuthChallenge
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        VerifyApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /auth/verify
            Method: POST
            Auth:
              Authorizer: NONE

  # User Profile: Get
  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-get-profile-${Environment}
      CodeUri: .
      Handler: src.api.user_profile_get.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserProfilesTable
          JWT_SECRET: !Sub '{{resolve:secretsmanager:bharatsahayak-jwt-secret-${Environment}:SecretString:jwt_secret}}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserProfilesTable
      Events:
        GetProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /user/profile
            Method: GET

  # User Profile: Update
  UpdateProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-update-profile-${Environment}
      CodeUri: .
      Handler: src.api.user_profile_update.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserProfilesTable
          JWT_SECRET: !Sub '{{resolve:secretsmanager:bharatsahayak-jwt-secret-${Environment}:SecretString:jwt_secret}}'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserProfilesTable
      Events:
        UpdateProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /user/profile
            Method: PUT

  # Schemes: Search
  SearchSchemesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-search-schemes-${Environment}
      CodeUri: .
      Handler: src.api.schemes_search.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        SearchSchemesApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes
            Method: GET
            Auth:
              Authorizer: NONE

  # Schemes: Get Details
  GetSchemeDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-scheme-details-${Environment}
      CodeUri: .
      Handler: src.api.scheme_details.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        GetSchemeDetailsApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/{scheme_id}
            Method: GET
            Auth:
              Authorizer: NONE

  # Eligibility: Check Single Scheme
  CheckEligibilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-check-eligibility-${Environment}
      CodeUri: .
      Handler: src.api.check_eligibility.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
          JWT_SECRET: !Sub '{{resolve:secretsmanager:bharatsahayak-jwt-secret-${Environment}:SecretString:jwt_secret}}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        CheckEligibilityApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/check-eligibility
            Method: POST

  # Eligibility: Get All Eligible Schemes
  GetEligibleSchemesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-eligible-schemes-${Environment}
      CodeUri: .
      Handler: src.api.eligible_schemes.lambda_handler
      Environment:
        Variables:
          SCHEMES_TABLE: !Ref SchemesTable
          JWT_SECRET: !Sub '{{resolve:secretsmanager:bharatsahayak-jwt-secret-${Environment}:SecretString:jwt_secret}}'
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SchemesTable
      Events:
        GetEligibleSchemesApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /schemes/eligible
            Method: POST

  # Farmer Advisory: Crop Recommendations
  CropAdviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-crop-advice-${Environment}
      CodeUri: .
      Handler: src.api.crop_advice.lambda_handler
      Environment:
        Variables:
          FARM_PROFILES_TABLE: !Ref FarmProfilesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FarmProfilesTable
      Events:
        CropAdviceApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /farmer/crop-advice
            Method: POST

  # Farmer Advisory: Mandi Prices
  MarketPriceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-market-price-${Environment}
      CodeUri: .
      Handler: src.api.market_price.lambda_handler
      Environment:
        Variables:
          MANDI_PRICES_TABLE: !Ref MandiPricesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MandiPricesTable
      Events:
        MarketPriceApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /farmer/market-price
            Method: GET
            Auth:
              Authorizer: NONE

  # Skills: Program Matching
  SkillsMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-skills-match-${Environment}
      CodeUri: .
      Handler: src.api.skills_match.lambda_handler
      Environment:
        Variables:
          SKILL_PROGRAMS_TABLE: !Ref SkillProgramsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SkillProgramsTable
      Events:
        SkillsMatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /skills/match
            Method: POST

  # Skills: Job Search
  JobSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-job-search-${Environment}
      CodeUri: .
      Handler: src.api.job_search.lambda_handler
      Environment:
        Variables:
          JOB_POSTINGS_TABLE: !Ref JobPostingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref JobPostingsTable
      Events:
        JobSearchApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /jobs
            Method: GET
            Auth:
              Authorizer: NONE

  # Health: Facility Search
  HealthFacilitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-health-facilities-${Environment}
      CodeUri: .
      Handler: src.api.health_facilities.lambda_handler
      Environment:
        Variables:
          HEALTH_FACILITIES_TABLE: !Ref HealthFacilitiesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HealthFacilitiesTable
      Events:
        HealthFacilitiesApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /health/facilities
            Method: GET
            Auth:
              Authorizer: NONE

  # Health: Symptom Checker
  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-health-check-${Environment}
      CodeUri: .
      Handler: src.api.health_check.lambda_handler
      Events:
        HealthCheckApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /health/check
            Method: POST
            Auth:
              Authorizer: NONE

  # Voice Interface: Speech-to-Text
  VoiceToTextFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-voice-to-text-${Environment}
      CodeUri: .
      Handler: src.api.voice_to_text.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref VoiceDataBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VoiceDataBucket
        - Statement:
            - Effect: Allow
              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob
                - transcribe:DeleteTranscriptionJob
              Resource: '*'
      Events:
        VoiceToTextApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /voice/transcribe
            Method: POST
            Auth:
              Authorizer: NONE

  # Voice Interface: Text-to-Speech
  TextToVoiceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-text-to-voice-${Environment}
      CodeUri: .
      Handler: src.api.text_to_voice.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref VoiceDataBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref VoiceDataBucket
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
              Resource: '*'
      Events:
        TextToVoiceApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /voice/synthesize
            Method: POST
            Auth:
              Authorizer: NONE

  # Voice Interface: Language Detection
  DetectLanguageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-detect-language-${Environment}
      CodeUri: .
      Handler: src.api.detect_language.lambda_handler
      Timeout: 30
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - comprehend:DetectDominantLanguage
                - comprehend:BatchDetectDominantLanguage
              Resource: '*'
      Events:
        DetectLanguageApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /voice/detect-language
            Method: POST
            Auth:
              Authorizer: NONE

  # Multilingual: Translate Scheme Content
  TranslateSchemeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bharatsahayak-translate-scheme-${Environment}
      CodeUri: .
      Handler: src.api.translate_scheme.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          TRANSLATION_CACHE_TABLE: !Ref TranslationCacheTable
          SCHEMES_TABLE: !Ref SchemesTable
          UPDATE_DYNAMODB: 'true'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref TranslationCacheTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SchemesTable
        - Statement:
            - Effect: Allow
              Action:
                - translate:TranslateText
              Resource: '*'
      Events:
        TranslateSchemeApi:
          Type: Api
          Properties:
            RestApiId: !Ref BharatSahayakApi
            Path: /translate/scheme
            Method: POST
            Auth:
              Authorizer: NONE

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${BharatSahayakApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint
  
  ApiStage:
    Description: API Gateway deployment stage
    Value: !Ref Environment
    Export:
      Name: !Sub ${AWS::StackName}-ApiStage
  
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId
  
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId
  
  UsersTableName:
    Description: DynamoDB Users Table Name
    Value: !Ref UsersTable
  
  SchemesTableName:
    Description: DynamoDB Schemes Table Name
    Value: !Ref SchemesTable
  
  UserProfilesTableName:
    Description: DynamoDB User Profiles Table Name
    Value: !Ref UserProfilesTable
  
  InteractionsTableName:
    Description: DynamoDB Interactions Table Name
    Value: !Ref InteractionsTable

  FarmProfilesTableName:
    Description: DynamoDB Farm Profiles Table Name
    Value: !Ref FarmProfilesTable

  MandiPricesTableName:
    Description: DynamoDB Mandi Prices Table Name
    Value: !Ref MandiPricesTable

  StaticContentBucketName:
    Description: S3 Bucket for Static Content and Scheme Documents
    Value: !Ref StaticContentBucket
    Export:
      Name: !Sub ${AWS::StackName}-StaticContentBucket

  StaticContentBucketUrl:
    Description: URL for Static Content Bucket
    Value: !Sub https://${StaticContentBucket}.s3.${AWS::Region}.amazonaws.com
    Export:
      Name: !Sub ${AWS::StackName}-StaticContentBucketUrl

  VoiceDataBucketName:
    Description: S3 Bucket for Voice Data (Audio Files)
    Value: !Ref VoiceDataBucket
    Export:
      Name: !Sub ${AWS::StackName}-VoiceDataBucket

  TranslationCacheTableName:
    Description: DynamoDB Translation Cache Table Name
    Value: !Ref TranslationCacheTable
    Export:
      Name: !Sub ${AWS::StackName}-TranslationCacheTable
